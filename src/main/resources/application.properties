spring.application.name=traveloka-hotel-booking-service

## Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

## Server, SSL
server.port=${SERVER_PORT}

## JPA chung
spring.jpa.open-in-view=true

## Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

## Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

## Security & JWT
jwt.secret=${JWT_SECRET}
jwt.accessTokenExpiration=900000
jwt.refreshTokenExpiration=604800000

## Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

## VNPay Sandbox
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.version=2.1.0
vnpay.command=pay

## Google Maps Geocoding API (FR-05)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}


