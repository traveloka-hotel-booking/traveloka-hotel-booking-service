# DataSource Properties production
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_PRODUCTION_URL}
spring.datasource.username=${DB_PRODUCTION_USERNAME}
spring.datasource.password=${DB_PRODUCTION_PASSWORD}

# Hikari Connection Pool Tuning cho môi trường Production (Đúng chuẩn ảnh Thầy)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000

# JPA / Hibernate cho môi trường Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis Cache cho môi trường Production
spring.data.redis.host=${REDIS_PRODUCTION_HOST:localhost}
spring.data.redis.port=${REDIS_PRODUCTION_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# URL ứng dụng Frontend cho môi trường Production
app.frontend.url=${DOMAIN_FRONT_END_PRODUCTION:http://localhost:5173}
