services:
  # 1. Máy chủ Redis Server (In-Memory Data Store & Caching)
  redis:
    image: redis:7-alpine
    container_name: traveloka-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Giao diện trực quan RedisInsight (Truy cập qua trình duyệt Web: http://localhost:8001)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: traveloka-redis-insight
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  # 3. Ứng dụng Backend Spring Boot (Tích hợp trực tiếp với Dockerfile)
  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traveloka-backend-app
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_LOCAL_HOST=redis
      - REDIS_LOCAL_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
